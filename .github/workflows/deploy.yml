name: Deploy

on:
  push:
    branches: [main]

permissions: {}

# The S3 state has no lock, so applies must never overlap
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  apply:
    name: Terraform apply
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          package-manager-cache: false

      # The apply zips src/, node_modules included. Scripts stay off because this job holds admin credentials.
      - name: Install Lambda dependencies
        working-directory: src
        run: yarn install --frozen-lockfile --production --ignore-scripts

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.0
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::905016994436:role/listpal-backend-apply
          role-session-name: listpal-apply-${{ github.run_id }}
          aws-region: eu-west-2

      - run: terraform init -input=false -no-color

      # The saved plan holds state values, so it stays on the runner and is never uploaded
      - run: terraform plan -input=false -no-color -out=tfplan
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_alert_email }}

      - run: terraform apply -input=false -no-color tfplan
