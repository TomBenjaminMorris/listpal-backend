name: Test and plan

on:
  pull_request:

permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  plan:
    name: Terraform plan
    needs: tests
    # Fork PRs get no AWS token, so the job would only fail
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The plan zips src/, node_modules included. Scripts stay off because this job holds AWS credentials.
      - name: Install Lambda dependencies
        working-directory: src
        run: yarn install --frozen-lockfile --production --ignore-scripts

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.3.0
          # The wrapper copies output into step outputs; keep the plan in the log only
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::905016994436:role/listpal-backend-plan
          role-session-name: listpal-plan-${{ github.run_id }}
          aws-region: eu-west-2

      - run: terraform init -input=false -no-color
      - run: terraform fmt -check -recursive -no-color
      - run: terraform validate -no-color

      # The log is public: sensitive values show as (sensitive), and the plan is never posted to the PR
      - run: terraform plan -input=false -no-color -lock=false
        env:
          TF_VAR_alert_email: ${{ secrets.TF_VAR_alert_email }}
